pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets the Java toolchain auto-provision JDK 25 if it isn't already installed locally.
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

rootProject.name = "nomadcaravans"

include("common")
include("fabric")
include("neoforge")
