# Gradle
# 4G: NeoForge's first-time decompile/installertools step needs more than 2G.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Loom/Architectury are not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Mod metadata
mod_id=nomadcaravans
mod_name=Nomad Caravans
mod_version=1.0.0
mod_license=All Rights Reserved
maven_group=com.sappyeddie.nomadcaravans
archives_base_name=nomadcaravans

# Which loader platforms the common module targets
enabled_platforms=fabric,neoforge

# Minecraft — 26.1+ ships unobfuscated, so there are no mappings and loom runs in "no-remap" mode.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]

# Fabric
fabric_loader_version=0.19.3
fabric_api_version=0.155.2+26.1.2

# NeoForge
neoforge_version=26.1.2.84

# Architectury API (20.x = the Minecraft 26.1 line)
architectury_api_version=20.0.9

# GeckoLib (matches the known-good Simply Tents 26.1.2 build)
geckolib_version=5.5.1
